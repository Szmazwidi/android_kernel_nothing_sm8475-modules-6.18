name: Pong 6.18.63 source-lock preflight
on:
  push:
    branches: [pong-a17-6.18.63-wlan-fastrpc]
    paths:
      - tools/pong618-63-*.py
      - docs/pong618-6.18.63-source-pin.json
      - docs/manifest/pong618-6.18.63-community-clg74.xml
      - .github/workflows/pong618-63-source-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source selection and historical manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/pong618-63-source-lock.py tools/pong618-63-build-preflight.py
          bash -n tools/build-release.sh
          python3 tools/pong618-63-source-lock.py --lint-only
          python3 - <<'PY'
          import json
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          pin = json.loads(Path("docs/pong618-6.18.63-source-pin.json").read_text())
          subprocess.run(["git", "merge-base", "--is-ancestor", pin["module_base"], "HEAD"], check=True)
          projects = {p.attrib["path"]: p.attrib for p in ET.parse(
              "docs/manifest/pong618-6.18.63-community-clg74.xml").findall("project")}
          common = projects["common"]
          modules = projects["devices/pong618"]
          assert common["revision"] == "afb821156627c8d10827ef8f01a4c302cef8e1b3"
          assert common["upstream"] == common["dest-branch"] == pin["kernel_branch"]
          assert modules["revision"] == "8abb74a64f232edb7c8d399d8fef62897d08ff45"
          assert modules["upstream"] == modules["dest-branch"] == "pong-a17-6.18.63-wlan-fastrpc"
          subprocess.run(["git", "merge-base", "--is-ancestor", modules["revision"], "HEAD"], check=True)
          PY
